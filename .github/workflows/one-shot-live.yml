name: One-time Telegram live integration test
on:
  push:
    paths:
      - '.github/workflows/one-shot-live.yml'
permissions:
  contents: read
concurrency:
  group: telegram-promotion
  cancel-in-progress: false
jobs:
  one_live_run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: telegram
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify explicit live switch and safety limits
        id: preflight
        env:
          STATE_REPO: ${{ secrets.STATE_REPO || 'skyfremen/tele-promo-state' }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          LIVE_ENABLED: ${{ vars.LIVE_ENABLED }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from promo.store import GitHubStore
          state = GitHubStore().state
          if os.environ.get('LIVE_ENABLED') != 'true':
              raise SystemExit('LIVE_ENABLED is not true. One-time live test blocked without Telegram mutations.')
          if state is None or state['config'].get('dry_run') is not False:
              raise SystemExit('Live test blocked: private state must explicitly disable dry-run.')
          limits=state['config']['limits']
          if (limits.get('min_group_members') != 500
                  or limits.get('joins_per_run') != 1
                  or limits.get('posts_per_run') != 1):
              raise SystemExit('Live test blocked: expected 500 member minimum, 1 join/run, 1 post/run.')
          if len(state['config']['shorts']) != 1 or not os.environ.get('TG_SESSION'):
              raise SystemExit('Live test blocked: expected one configured link and a valid session secret.')
          print('One-time live preflight passed: Telegram permissions and group restrictions stay enforced.')
          print('Existing post records:', len(state['posts']))
          PY
      - name: Attempt exactly one bounded live promotion cycle
        env:
          STATE_REPO: ${{ secrets.STATE_REPO || 'skyfremen/tele-promo-state' }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -m promo run --live
      - name: Report sanitized final result
        if: always()
        env:
          STATE_REPO: ${{ secrets.STATE_REPO || 'skyfremen/tele-promo-state' }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from promo.store import GitHubStore
          state=GitHubStore().state
          if state is None:
              raise SystemExit('No private state was available')
          groups=list(state['groups'].values())
          statuses=Counter(g.get('status','unknown') for g in groups)
          sources=Counter(g.get('source','unknown') for g in groups)
          posts=Counter(p.get('status','unknown') for p in state['posts'].values())
          print('Total discovered groups:',len(groups))
          print('Previously joined groups inspected:',sources.get('already_joined',0))
          print('Eligible:',statuses.get('eligible',0))
          print('Needs manual permission:',statuses.get('needs_approval',0))
          print('Below minimum:',statuses.get('below_member_minimum',0))
          print('Successful posting records:',posts.get('confirmed',0))
          print('Uncertain posting records:',posts.get('uncertain',0))
          print('Dry-run:',state['config']['dry_run'])
          PY
