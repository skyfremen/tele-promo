name: Telegram group discovery and joining
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-promotion
  cancel-in-progress: false
jobs:
  discover_join:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: telegram
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run with private state
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          STATE_REPO: ${{ secrets.STATE_REPO }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: python -m promo run --mode join --live
