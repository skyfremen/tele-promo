name: Manage Telegram promotion
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Check status, initialize private state, or configure Shorts in dry-run'
        type: choice
        required: true
        default: status
        options:
          - status
          - bootstrap
          - configure
          - activate
          - pause
      confirm_live:
        description: 'Confirm live actions; also requires LIVE_ENABLED repository variable'
        type: boolean
        required: false
        default: false
      shorts:
        description: 'Shorts URLs separated by commas (configure only; replaces current list)'
        type: string
        required: false
      keywords:
        description: 'Up to five comma-separated group search keywords (optional)'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: telegram-promotion
  cancel-in-progress: false
jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Manage private state without Telegram mutations
        env:
          STATE_REPO: ${{ secrets.STATE_REPO || 'skyfremen/tele-promo-state' }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          MOBILE_ACTION: ${{ inputs.action }}
          MOBILE_CONFIRM_LIVE: ${{ inputs.confirm_live }}
          LIVE_ENABLED: ${{ vars.LIVE_ENABLED }}
          MOBILE_SHORTS: ${{ inputs.shorts }}
          MOBILE_KEYWORDS: ${{ inputs.keywords }}
        run: python -m promo.admin
